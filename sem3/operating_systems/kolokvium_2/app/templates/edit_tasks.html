{% extends "base.html" %}

{% block title %}Edit Task - Todo App{% endblock %}

{% block content %}
<div class="edit-task-container">
    <div class="edit-task-card">
        <div class="edit-task-header">
            <h2><i class="fas fa-edit"></i> Edit Task</h2>
        </div>

        <form id="edit-task-form" class="edit-task-form">
            <input type="hidden" id="taskId" value="{{ task_id }}">
            
            <div class="form-group">
                <label for="taskTitle"><i class="fas fa-heading"></i> Title *</label>
                <input type="text" id="taskTitle" class="form-control" placeholder="Enter task title" required>
            </div>
            
            <div class="form-group">
                <label for="taskDescription"><i class="fas fa-align-left"></i> Description</label>
                <textarea id="taskDescription" class="form-control" placeholder="Add details..." rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label for="taskStatus"><i class="fas fa-flag"></i> Status</label>
                <select id="taskStatus" class="form-control">
                    <option value="todo">📝 TODO</option>
                    <option value="in_progress">⚡ IN_PROGRESS</option>
                    <option value="done">✅ DONE</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Update Task
                </button>
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="button" id="delete-task-btn" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Delete Task
                </button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const taskId = document.getElementById('taskId').value;
    loadTask(taskId);
    setupEditForm();
});

function loadTask(taskId) {
    const token = localStorage.getItem('jwt_token');
    if (!token) {
        showToast('Please login to continue', 'warning', 'Authentication Required');
        window.location.href = '/login';
        return;
    }
    
    fetch(`/api/tasks/${taskId}`, {
        headers: {
            'Authorization': `Bearer ${token}`
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            const task = data.data;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDescription').value = task.description || '';
            document.getElementById('taskStatus').value = task.status;
        } else {
            showToast('Failed to load task: ' + data.message, 'error', 'Error');
            setTimeout(() => window.history.back(), 1500);
        }
    })
    .catch(error => {
        console.error('Error loading task:', error);
        showToast('Failed to load task', 'error', 'Error');
        setTimeout(() => window.history.back(), 1500);
    });
}

function setupEditForm() {
    const form = document.getElementById('edit-task-form');
    const deleteBtn = document.getElementById('delete-task-btn');
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const taskId = document.getElementById('taskId').value;
        const title = document.getElementById('taskTitle').value.trim();
        const description = document.getElementById('taskDescription').value.trim();
        const status = document.getElementById('taskStatus').value;
        
        if (!title) {
            showToast('Task title is required', 'warning', 'Validation Error');
            return;
        }
        
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            showToast('Please login to continue', 'warning', 'Authentication Required');
            window.location.href = '/login';
            return;
        }
        
        try {
            const response = await fetch(`/api/tasks/${taskId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, description, status })
            });
            
            const result = await response.json();
            
            if (response.ok && result.success) {
                showToast('Task updated successfully!', 'success', 'Success');
                setTimeout(() => {
                    window.location.href = '/tasks';
                }, 1000);
            } else {
                showToast('Error: ' + result.message, 'error', 'Error');
            }
        } catch (error) {
            console.error('Error updating task:', error);
            showToast('Failed to update task', 'error', 'Error');
        }
    });
    
    deleteBtn.addEventListener('click', async function() {
        if (!confirm('Are you sure you want to delete this task?')) {
            return;
        }
        
        const taskId = document.getElementById('taskId').value;
        const token = localStorage.getItem('jwt_token');
        
        if (!token) {
            showToast('Please login to continue', 'warning', 'Authentication Required');
            window.location.href = '/login';
            return;
        }
        
        try {
            const response = await fetch(`/api/tasks/${taskId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (response.ok) {
                showToast('Task deleted successfully!', 'success', 'Success');
                setTimeout(() => {
                    window.location.href = '/tasks';
                }, 1000);
            } else {
                const errorData = await response.json();
                showToast('Error: ' + errorData.message, 'error', 'Error');
            }
        } catch (error) {
            console.error('Error deleting task:', error);
            showToast('Failed to delete task', 'error', 'Error');
        }
    });
}
</script>

<style>
.edit-task-container {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.edit-task-card {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 500px;
}

.edit-task-header {
    text-align: center;
    margin-bottom: 2rem;
}

.edit-task-form {
    margin-top: 1rem;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 2rem;
}

.btn-danger {
    background: #ff6b6b;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
}

.btn-danger:hover {
    background: #ff5252;
}

.toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.toast {
    background: white;
    border-radius: 8px;
    padding: 15px 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 300px;
    max-width: 400px;
    transform: translateX(100%);
    animation: slideInRight 0.3s ease forwards;
    border-left: 4px solid;
}

.toast.success {
    border-left-color: #06d6a0;
    background: #e6faf3;
}

.toast.error {
    border-left-color: #ff6b6b;
    background: #ffefef;
}

.toast.info {
    border-left-color: #667eea;
    background: #f0f4ff;
}

.toast.warning {
    border-left-color: #ffa500;
    background: #fff5e6;
}

.toast-icon {
    font-size: 20px;
}

.toast.success .toast-icon {
    color: #06d6a0;
}

.toast.error .toast-icon {
    color: #ff6b6b;
}

.toast.info .toast-icon {
    color: #667eea;
}

.toast.warning .toast-icon {
    color: #ffa500;
}

.toast-content {
    flex: 1;
}

.toast-title {
    font-weight: 600;
    margin-bottom: 4px;
    color: #212529;
}

.toast-message {
    font-size: 14px;
    color: #6c757d;
}

.toast-close {
    background: none;
    border: none;
    color: #adb5bd;
    cursor: pointer;
    padding: 5px;
    border-radius: 4px;
}

.toast-close:hover {
    background: #f8f9fa;
    color: #6c757d;
}

@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes slideOutRight {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(100%);
        opacity: 0;
    }
}
</style>
{% endblock %}
