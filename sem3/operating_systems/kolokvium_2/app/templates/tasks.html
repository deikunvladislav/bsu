{% extends "base.html" %}

{% block title %}My Tasks - Todo App{% endblock %}

{% block content %}
<div class="tasks-container">
    <div class="tasks-header">
        <h1><i class="fas fa-list-check"></i> My Tasks</h1>
        <div class="header-actions">
            <button id="create-task-btn" class="btn-action primary">
                <i class="fas fa-plus"></i> New Task
            </button>
            <div class="search-box">
                <input type="text" id="task-search" placeholder="Search tasks..." class="search-input">
                <button id="search-btn" class="btn-search">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="tasks-toolbar">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Tasks</button>
            <button class="filter-btn" data-filter="todo">TODO</button>
            <button class="filter-btn" data-filter="in_progress">IN_PROGRESS</button>
            <button class="filter-btn" data-filter="done">DONE</button>
        </div>
        <div class="sort-options">
            <select id="sort-select" class="sort-select">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="title_asc">Title A-Z</option>
                <option value="title_desc">Title Z-A</option>
                <option value="status">By Status</option>
            </select>
        </div>
    </div>

    <div class="tasks-grid">
        <div id="tasks-list" class="tasks-list">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i> Loading tasks...
            </div>
        </div>
    </div>

    <div class="tasks-footer">
        <div class="pagination">
            <button id="prev-page" class="btn-pagination" disabled>
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            <span id="page-info">Page 1</span>
            <button id="next-page" class="btn-pagination">
                Next <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        <div class="stats-summary">
            <span id="total-tasks">0 tasks</span>
            <span id="filtered-tasks">Showing 0</span>
        </div>
    </div>
</div>

<div id="taskModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-plus"></i> Create New Task</h3>
            <button class="close-modal">&times;</button>
        </div>
        <div class="modal-body">
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle"><i class="fas fa-heading"></i> Title *</label>
                    <input type="text" id="taskTitle" class="form-input" placeholder="Enter task title" required>
                </div>
                
                <div class="form-group">
                    <label for="taskDescription"><i class="fas fa-align-left"></i> Description</label>
                    <textarea id="taskDescription" class="form-textarea" placeholder="Add details..." rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="taskStatus"><i class="fas fa-flag"></i> Status</label>
                    <select id="taskStatus" class="form-select">
                        <option value="todo">📝 TODO</option>
                        <option value="in_progress">⚡ IN_PROGRESS</option>
                        <option value="done">✅ DONE</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-check"></i> Create Task
                    </button>
                    <button type="button" class="btn-cancel close-modal">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let currentFilter = 'all';
let currentSearch = '';
let allTasks = [];
let filteredTasks = [];
const tasksPerPage = 10;

document.addEventListener('DOMContentLoaded', function() {
    loadAllTasks();
    setupEventListeners();
});

function setupEventListeners() {
    const modal = document.getElementById('taskModal');
    const createBtn = document.getElementById('create-task-btn');
    const closeBtns = document.querySelectorAll('.close-modal');
    
    if (createBtn) {
        createBtn.addEventListener('click', function() {
            modal.style.display = 'block';
        });
    }
    
    closeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            modal.style.display = 'none';
            document.getElementById('taskForm').reset();
        });
    });
    
    window.addEventListener('click', function(e) {
        if (e.target === modal) {
            modal.style.display = 'none';
            document.getElementById('taskForm').reset();
        }
    });
    
    const taskForm = document.getElementById('taskForm');
    if (taskForm) {
        taskForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            await handleTaskSubmit(e);
        });
    }
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            currentPage = 1;
            applyFiltersAndRender();
        });
    });
    
    const searchBtn = document.getElementById('search-btn');
    const searchInput = document.getElementById('task-search');
    
    if (searchBtn) {
        searchBtn.addEventListener('click', function() {
            currentSearch = searchInput.value.trim();
            currentPage = 1;
            applyFiltersAndRender();
        });
    }
    
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                currentSearch = this.value.trim();
                currentPage = 1;
                applyFiltersAndRender();
            }
        });
        
        let searchTimeout;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = this.value.trim();
                currentPage = 1;
                applyFiltersAndRender();
            }, 500);
        });
    }
    
    const sortSelect = document.getElementById('sort-select');
    if (sortSelect) {
        sortSelect.addEventListener('change', function() {
            currentPage = 1;
            applyFiltersAndRender();
        });
    }
    
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    
    if (prevBtn) {
        prevBtn.addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                renderCurrentPage();
            }
        });
    }
    
    if (nextBtn) {
        nextBtn.addEventListener('click', function() {
            const totalPages = Math.ceil(filteredTasks.length / tasksPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderCurrentPage();
            }
        });
    }
}

async function loadAllTasks() {
    const token = localStorage.getItem('jwt_token');
    if (!token) {
        showToast('Please login to continue', 'warning', 'Authentication Required');
        window.location.href = '/login';
        return;
    }
    
    try {
        let tasks = [];
        let offset = 0;
        const limit = 100;
        
        while (true) {
            const response = await fetch(`/api/tasks?limit=${limit}&offset=${offset}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Failed to load tasks');
            }
            
            const result = await response.json();
            if (result.success) {
                tasks = tasks.concat(result.data.tasks || []);
                
                if (!result.data.tasks || result.data.tasks.length < limit) {
                    break;
                }
                offset += limit;
            } else {
                throw new Error(result.message || 'Failed to load tasks');
            }
        }
        
        allTasks = tasks;
        applyFiltersAndRender();
    } catch (error) {
        console.error('Error loading tasks:', error);
        showError('Failed to load tasks: ' + error.message);
    }
}

function applyFiltersAndRender() {
    if (currentFilter === 'all') {
        filteredTasks = [...allTasks];
    } else {
        filteredTasks = allTasks.filter(task => task.status === currentFilter);
    }
    
    if (currentSearch) {
        const searchLower = currentSearch.toLowerCase();
        filteredTasks = filteredTasks.filter(task => 
            task.title.toLowerCase().includes(searchLower) ||
            (task.description && task.description.toLowerCase().includes(searchLower))
        );
    }
    
    const sortSelect = document.getElementById('sort-select');
    const sortValue = sortSelect ? sortSelect.value : 'newest';
    
    filteredTasks.sort((a, b) => {
        switch(sortValue) {
            case 'oldest':
                return new Date(a.created_at) - new Date(b.created_at);
            case 'title_asc':
                return a.title.localeCompare(b.title);
            case 'title_desc':
                return b.title.localeCompare(a.title);
            case 'status':
                return a.status.localeCompare(b.status);
            case 'newest':
            default:
                return new Date(b.created_at) - new Date(a.created_at);
        }
    });
    
    renderCurrentPage();
}

function renderCurrentPage() {
    const start = (currentPage - 1) * tasksPerPage;
    const end = start + tasksPerPage;
    const tasksToShow = filteredTasks.slice(start, end);
    
    renderTasks(tasksToShow);
    updatePagination();
}

function renderTasks(tasks) {
    const tasksList = document.getElementById('tasks-list');
    
    if (tasks.length === 0) {
        tasksList.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <h3>No tasks found</h3>
                <p>${currentSearch ? 'Try a different search term' : 'Create your first task!'}</p>
                ${!currentSearch ? `
                <button id="create-first-task" class="btn-create-first">
                    <i class="fas fa-plus"></i> Create First Task
                </button>
                ` : ''}
            </div>
        `;
        
        const createFirstBtn = document.getElementById('create-first-task');
        if (createFirstBtn) {
            createFirstBtn.addEventListener('click', function() {
                document.getElementById('taskModal').style.display = 'block';
            });
        }
        return;
    }
    
    let html = '';
    tasks.forEach(task => {
        const created = new Date(task.created_at).toLocaleDateString();
        const statusClass = getStatusClass(task.status);
        const statusText = task.status.toUpperCase();
        
        html += `
        <div class="task-card ${statusClass}" data-id="${task.id}">
            <div class="task-card-header">
                <h4 class="task-card-title">${escapeHtml(task.title)}</h4>
                <span class="task-card-status ${statusClass}">${statusText}</span>
            </div>
            
            ${task.description ? `
            <div class="task-card-description">
                ${escapeHtml(task.description.length > 150 ? task.description.substring(0, 150) + '...' : task.description)}
            </div>` : ''}
            
            <div class="task-card-footer">
                <div class="task-card-meta">
                    <span class="task-date"><i class="far fa-calendar"></i> ${created}</span>
                    ${task.updated_at !== task.created_at ? 
                    `<span class="task-updated"><i class="fas fa-edit"></i> Updated</span>` : ''}
                </div>
                
                <div class="task-card-actions">
                    <button class="btn-action-small edit" onclick="editTask(${task.id})">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn-action-small delete" onclick="deleteTask(${task.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        </div>`;
    });
    
    tasksList.innerHTML = html;
}

function updatePagination() {
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const pageInfo = document.getElementById('page-info');
    
    const totalPages = Math.ceil(filteredTasks.length / tasksPerPage);
    pageInfo.textContent = `Page ${currentPage} of ${totalPages || 1}`;
    
    if (prevBtn) {
        prevBtn.disabled = currentPage === 1;
    }
    if (nextBtn) {
        nextBtn.disabled = currentPage >= totalPages || totalPages === 0;
    }
    
    document.getElementById('total-tasks').textContent = `${filteredTasks.length} tasks`;
    const showing = Math.min(tasksPerPage, filteredTasks.length - (currentPage - 1) * tasksPerPage);
    document.getElementById('filtered-tasks').textContent = `Showing ${showing} of ${filteredTasks.length}`;
}

async function handleTaskSubmit(e) {
    const title = document.getElementById('taskTitle').value.trim();
    const description = document.getElementById('taskDescription').value.trim();
    const status = document.getElementById('taskStatus').value;
    
    if (!title) {
        showToast('Task title is required', 'warning', 'Validation Error');
        return;
    }
    
    const token = localStorage.getItem('jwt_token');
    if (!token) {
        showToast('Please login to continue', 'warning', 'Authentication Required');
        window.location.href = '/login';
        return;
    }
    
    const submitBtn = e.target.querySelector('.btn-submit');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
    submitBtn.disabled = true;
    
    try {
        const response = await fetch('/api/tasks', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                title: title,
                description: description,
                status: status
            })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            showToast('Task created successfully!', 'success', 'Success');
            
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('taskForm').reset();
            
            loadAllTasks();
        } else {
            showToast(`Error: ${result.message}`, 'error', 'Error');
        }
    } catch (error) {
        console.error('Error creating task:', error);
        showToast('Failed to create task', 'error', 'Error');
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
}

function showError(message) {
    const tasksList = document.getElementById('tasks-list');
    tasksList.innerHTML = `
        <div class="error-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>${message}</h3>
            <button onclick="loadAllTasks()" class="btn-retry">
                <i class="fas fa-redo"></i> Try Again
            </button>
        </div>
    `;
}

function getStatusClass(status) {
    switch(status) {
        case 'todo': return 'status-todo';
        case 'in_progress': return 'status-progress';
        case 'done': return 'status-done';
        default: return '';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

window.editTask = function(taskId) {
    window.location.href = `/tasks/${taskId}/edit`;
};

window.deleteTask = async function(taskId) {
    if (!confirm('Are you sure you want to delete this task?')) {
        return;
    }
    
    const token = localStorage.getItem('jwt_token');
    if (!token) {
        showToast('Please login to continue', 'warning', 'Authentication Required');
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await fetch(`/api/tasks/${taskId}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            showToast('Task deleted successfully', 'success', 'Success');
            loadAllTasks();
        } else {
            const errorMsg = result.message || 'Failed to delete task';
            showToast(`Error: ${errorMsg}`, 'error', 'Error');
        }
    } catch (error) {
        console.error('Delete error:', error);
        showToast('Error deleting task', 'error', 'Error');
    }
};
</script>
