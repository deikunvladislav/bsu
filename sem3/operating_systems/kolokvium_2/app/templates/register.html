{% extends "base.html" %}

{% block title %}Register - Todo App{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="fas fa-user-plus"></i> Register</h2>
            <p>Create your free account</p>
        </div>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" required 
                       placeholder="Choose a username (3-80 chars)" 
                       minlength="3" maxlength="80" class="form-control">
                <div class="form-hint">Letters and numbers only</div>
                <div class="form-error" id="username-error"></div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" required 
                       placeholder="Choose a password (min 6 chars)" 
                       minlength="6" class="form-control">
                <div class="form-error" id="password-error"></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" id="confirm-password" name="confirm_password" required 
                       placeholder="Confirm your password" class="form-control">
                <div class="form-error" id="confirm-password-error"></div>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </div>

            <div class="auth-footer">
                <p>Already have an account? 
                    <a href="{{ url_for('frontend.login') }}">Login here</a>
                </p>
                <p>
                    <a href="{{ url_for('frontend.index') }}">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    setupRegisterForm();
});
</script>
{% endblock %}
